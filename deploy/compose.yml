services:
  identity-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "${PORT:-8081}:8081"
      - "127.0.0.1:${MANAGEMENT_PORT:-9081}:9081"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      PORT: 8081
      MANAGEMENT_PORT: 9081
      DB_URL: ${DB_URL:?Set DB_URL to the existing identity database reachable from this container}
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64:?Set JWT_SECRET_BASE64}
      JWT_ISSUER: ${JWT_ISSUER:-telemed-ia-identity-and-access}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-PT15M}
