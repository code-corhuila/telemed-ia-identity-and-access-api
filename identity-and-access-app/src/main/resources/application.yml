spring:
  application:
    name: telemed-ia-identity-and-access-api

  profiles:
    default: dev

  lifecycle:
    timeout-per-shutdown-phase: 20s

  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:5000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:3000}
      data-source-properties:
        options: ${DB_STATEMENT_OPTIONS:-c statement_timeout=5000}

server:
  port: ${PORT:8081}

  shutdown: graceful

  tomcat:
    connection-timeout: ${HTTP_CONNECTION_TIMEOUT:5s}
    keep-alive-timeout: ${HTTP_KEEP_ALIVE_TIMEOUT:60s}
    max-keep-alive-requests: ${HTTP_MAX_KEEP_ALIVE_REQUESTS:100}

management:
  server:
    port: ${MANAGEMENT_PORT:9081}

  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      probes:
        enabled: true

security:
  jwt:
    issuer: ${JWT_ISSUER:telemed-ia-identity-and-access}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT1H}
    private-key: ${JWT_PRIVATE_KEY:}
    private-key-file: ${JWT_PRIVATE_KEY_FILE:}
    public-key: ${JWT_PUBLIC_KEY:}
    public-key-file: ${JWT_PUBLIC_KEY_FILE:}

  refresh-token:
    ttl: ${REFRESH_TOKEN_TTL:P7D}

  password-reset-token:
    ttl: ${PASSWORD_RESET_TOKEN_TTL:PT30M}

  password-recovery:
    reset-url: ${PASSWORD_RESET_URL:http://localhost:4200/auth/reset-password}

  # Service clients allowed to create professional accounts at POST /internal/accounts.
  account-provisioning:
    clients: ${ACCOUNT_PROVISIONING_CLIENTS:professional-management}

  # Norma 5.7: services (document generation, the worker...) ask POST /internal/service-token.
  # "client-id:bcrypt-hash,client-id:bcrypt-hash"; empty means no service may get a token.
  service-clients: ${SERVICE_CLIENTS:}
  service-token:
    ttl: ${SERVICE_TOKEN_TTL:PT10M}

  # First ADMIN, created at startup only when no ADMIN exists. All four values, or none.
  bootstrap-admin:
    full-name: ${BOOTSTRAP_ADMIN_FULL_NAME:}
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    identity-document: ${BOOTSTRAP_ADMIN_IDENTITY_DOCUMENT:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}