spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

# No localhost fallback outside development.
security:
  password-recovery:
    reset-url: ${PASSWORD_RESET_URL}

logging:
  level:
    root: INFO
    com.telemed.identityaccess: INFO