spring:
  application:
    name: telemed-ia-identity-and-access-api

  profiles:
    default: dev

server:
  port: ${PORT:8081}

management:
  server:
    port: ${MANAGEMENT_PORT:9081}

  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      probes:
        enabled: true