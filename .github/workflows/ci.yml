name: CI

on:
  pull_request:
    branches: [develop, qa, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout API
        uses: actions/checkout@v4

      - name: Checkout official Identity DB migrations
        uses: actions/checkout@v4
        with:
          repository: code-corhuila/telemed-ia-identity-and-access-db
          ref: 62c4fa4b74397ed0710f082bcc23f6cc8180da56
          path: .e2e/identity-db
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test against official DB schema
        env:
          IDENTITY_DB_MIGRATIONS_DIR: ${{ github.workspace }}/.e2e/identity-db
        run: mvn -B verify
